
version: 2.1

# Orbs provide reusable CircleCI configuration
orbs:
  python: circleci/python@2.1.1

# Define reusable executors
executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project

# Define reusable commands
commands:
  install-uv:
    description: "Install uv package manager"
    steps:
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version

  setup-project:
    description: "Set up project dependencies with uv"
    steps:
      - run:
          name: Sync dependencies with uv
          command: |
            uv sync --all-packages --extra dev
            
  save-test-results:
    description: "Save test results and coverage"
    steps:
      - run:
          name: Convert coverage to XML
          command: |
            uv run coverage xml
          when: always
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: htmlcov

# Define jobs
jobs:
  build:
    executor: python-executor
    steps:
      - checkout
      - install-uv
      - setup-project
      - run:
          name: Verify installation
          command: |
            uv tree
            uv run python --version
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  lint:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Run Ruff linting
          command: |
            uv run ruff check . --output-format=github
      - run:
          name: Run Ruff formatting check
          command: |
            uv run ruff format --check .
      - run:
          name: Run MyPy type checking
          command: |
            uv run mypy src tests

  unit_test:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Run unit tests with coverage
          command: |
            uv run pytest src/ \
              --cov=src \
              --cov-report=term-missing \
              --cov-report=html \
              --cov-report=xml \
              --cov-fail-under=85 \
              --junitxml=test-results/unit-tests.xml \
              -v
      - save-test-results

  circleci_test:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Run CircleCI-compatible tests
          command: |
            uv run pytest -m circleci \
              --junitxml=test-results/circleci-tests.xml \
              --tb=short \
              -v
      - save-test-results

  integration_test:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Set up Google Tasks credentials from environment
          command: |
            # Environment variables are provided via CircleCI context
            # GTASK_CLIENT_ID, GTASK_CLIENT_SECRET, GTASK_REFRESH_TOKEN
            echo "Using environment variables for authentication"
            env | grep GTASK || echo "Warning: GTASK environment variables not set"
      - run:
          name: Run integration tests
          command: |
            uv run pytest -m integration \
              --junitxml=test-results/integration-tests.xml \
              --tb=short \
              -v
      - save-test-results

  e2e_test:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Set up Google Tasks credentials from environment
          command: |
            # Environment variables are provided via CircleCI context
            echo "Using environment variables for authentication"
            env | grep GTASK || echo "Warning: GTASK environment variables not set"
      - run:
          name: Run e2e tests
          command: |
            uv run pytest -m e2e \
              --junitxml=test-results/e2e-tests.xml \
              --tb=short \
              -v
      - save-test-results

  report_summary:
    executor: python-executor
    steps:
      - attach_workspace:
          at: ~/project
      - install-uv
      - run:
          name: Generate test summary
          command: |
            echo "=== Test Summary ===" > test-summary.txt
            echo "Build completed at: $(date)" >> test-summary.txt
            echo "Branch: $CIRCLE_BRANCH" >> test-summary.txt
            echo "Commit: $CIRCLE_SHA1" >> test-summary.txt
            echo "" >> test-summary.txt
            echo "All tests passed successfully!" >> test-summary.txt
      - store_artifacts:
          path: test-summary.txt

# Define workflows
workflows:
  version: 2
  
  # Main workflow - runs on every push to every branch
  build_test_deploy:
    jobs:
      # Build job runs first
      - build
      
      # Lint and unit tests run in parallel after build
      - lint:
          requires:
            - build
            
      - unit_test:
          requires:
            - build
      
      # CircleCI-compatible tests run after unit tests
      - circleci_test:
          requires:
            - unit_test
      
      # Integration tests run on all branches (with credentials context)
      - integration_test:
          requires:
            - circleci_test
          context:
            - gtask-client
      
      # E2E tests run on all branches (with credentials context)
      - e2e_test:
          requires:
            - circleci_test
          context:
            - gtask-client
      
      # Report summary runs after all tests complete
      - report_summary:
          requires:
            - lint
            - unit_test
            - circleci_test
            - integration_test
            - e2e_test
