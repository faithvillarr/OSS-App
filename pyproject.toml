[project]
name = "ta-assignment"
version = "0.1.0"
description = "Ticketing integration application with AI and chatbot capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth-oauthlib>=1.2.2",
    "mkdocs>=1.6.1",
    "openapi-python-client>=0.27.1",
    "python-dotenv>=1.0.0",
    "types-requests>=2.32.4.20250913",
]

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.10.0",
    "ruff>=0.12.7",
    "types-requests>=2.32.4.20250611",
]
test = [
    "pytest-mock>=3.10.0",
    "respx>=0.20.2",  # HTTP mocking for httpx (used by discord_client_impl tests)
]

[tool.uv.workspace]
members = [
  "src/main_service",

  "src/gtask_client_impl",
  "src/task_client_api",
  "src/tickets_api",
  "src/tickets_client_impl",

  "src/discord_api",
  "src/discord_client_impl",
  "src/chat_api",
  "src/chat_client_impl",

  "src/ai_api",
  "src/openai_impl",
]

[tool.ruff]
line-length = 130 # high for top level due to tests
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # The `COM812` rule may cause conflicts with code formatters. It is ignored to avoid unexpected behavior.
  "D203", # `incorrect-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `incorrect-blank-line-before-class`.
  "D213", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`.
  "S101", # Use of `assert` detected --> Asserts are good in our opinion. Tests use asserts profusely.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "TRY300", "BLE001", "ANN401", "SLF001", "E501",
    "S105", "ARG001", "ARG002", "S106", "INP001",
    "PLC0415", "ERA001"
]
"**/tests/conftest.py" = ["INP001"]  # Adding __init__.py causes pytest namespace conflicts with --import-mode=importlib
"example_usage.py" = ["SLF001", "TRY300", "BLE001", "T201", "D401", "ANN204", "PLR2004", "S110"]
"quickstart_openai.py" = ["T201", "D401"]
"discord_main.py" = ["T201"]

[tool.mypy]
strict = true
explicit_package_bases = true # Required for src layout
exclude = [
  "src/.*/tests/.*",  # Exclude test directories within src to avoid duplicate module names
]
# Packages are structured as src/<package>/src/<package>/, so we need to add src/<package>/src to the path
# to find the actual package modules when imports use "from <package> import ..."
mypy_path = [
  "src/main_service/src",
  "src/gtask_client_impl/src",
  "src/task_client_api/src",
  "src/tickets_api/src",
  "src/tickets_client_impl/src",
  "src/discord_api/src",
  "src/discord_client_impl/src",
  "src/chat_api/src",
  "src/chat_client_impl/src",
  "src/ai_api/src",
  "src/openai_impl/src",
]
ignore_missing_imports = false
warn_unused_ignores = false

# Allow untyped imports for specific modules
[[tool.mypy.overrides]]
module = [
    "google.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "authlib.*",
    "discord_client_service.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    ".", 
    "src"
]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
omit = ["/tests/", "/main.py", "/mail_client_service_client/*"]

[tool.coverage.report]
fail_under = 85 # Justification: A high threshold ensures most code is tested.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]
