receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 512
    send_batch_max_size: 512
  
  resource:
    attributes:
      - key: cloud.provider
        value: gcp
        action: upsert
      - key: service.name
        from_attribute: service.name
        action: upsert

exporters:
  # Only use debug exporter for local development
  # Google Cloud exporter requires credentials which are automatically
  # available in Cloud Run via service identity, but need to be configured locally
  debug:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
