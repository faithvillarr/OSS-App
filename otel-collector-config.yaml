receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 512
    send_batch_max_size: 512
  
  resource:
    attributes:
      - key: cloud.provider
        value: gcp
        action: upsert
      - key: service.name
        from_attribute: service.name
        action: upsert

exporters:
  googlecloud:
    project: ${GCP_PROJECT_ID}
    metric:
      prefix: "custom.googleapis.com/opentelemetry"
      # Use service name from resource attributes
      service_resource_labels: true
  
  debug:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [googlecloud, debug]

