[project]
name = "chat-service"
version = "0.1.0"
description = "FastAPI Chat service with tickets integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1,<3.0",
    "slack-sdk>=3.27.0",
    "google-cloud-monitoring>=2.15.0",
    "ai-api",
    "openai-impl",
    "tickets-api",
    "tickets-client-impl",
    "chat-api",
    "chat-client-impl",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["main_service*"]

[tool.uv.sources]
ai-api = { workspace = true }
openai-impl = { workspace = true }
tickets-api = { workspace = true }
tickets-client-impl = { workspace = true }
chat-api = { workspace = true }
chat-client-impl = { workspace = true }
