[mypy]
python_version = 3.11
strict = true
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = false
ignore_missing_imports = false

# Exclude nested src directories to avoid duplicate module detection
# When running "mypy src", exclude paths like "chat_client_impl/src/chat_client_impl/..."
exclude = .*/src/.*

[mypy-ai_api]
ignore_missing_imports = false

[mypy-google.*]
ignore_missing_imports = true

[mypy-googleapiclient.*]
ignore_missing_imports = true

[mypy-google_auth_oauthlib.*]
ignore_missing_imports = true

[mypy-task_client_service.*]
ignore_missing_imports = true
